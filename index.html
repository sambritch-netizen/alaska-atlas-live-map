<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  />

  <title>Alaska Atlas Live Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-panel: #10161A;
      --brass: #C1913F;
      --parchment: #ECE6D6;
      --slate: #8B95A1;
      --cold: #4C86A8;
      --warn: #B23B34;
      --hairline: rgba(236, 230, 214, 0.16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      color: var(--parchment);
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2a3036;
    }

    .leaflet-control-attribution {
      display: none;
    }

    .eyebrow {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      letter-spacing: 0.16em;
      font-size: 11px;
      color: var(--brass);
      text-transform: uppercase;
    }

    #status-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      padding: 9px 14px;
      border-radius: 6px;
      background: rgba(16, 22, 26, 0.88);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status-badge.stale #wifi-bars rect {
      fill: var(--warn) !important;
      opacity: 0.6;
    }

    #status-badge .coords {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #status-badge.stale .coords { color: var(--warn); }

    #lower-third {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      z-index: 1000;

      background: rgba(16, 22, 26, 0.88);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 12px 16px 10px;
    }

    #lower-third .eyebrow {
      margin-bottom: 8px;
      text-align: center;
      display: block;
    }

    #tally-row {
      display: flex;
      justify-content: center;
      gap: 26px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--hairline);
    }

    .tally-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tally-item .glyph {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .tally-item .label {
      font-size: 10px;
      color: var(--slate);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'Oswald', sans-serif;
    }

    #stats-row {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 22px;
      font-size: 15px;
      font-weight: 500;
      flex-wrap: wrap;
    }

    #stats-row .stat {
      text-align: center;
    }

    #stats-row .stat .n {
      font-weight: 700;
      color: var(--parchment);
    }

    #stats-row .stat .label {
      font-size: 9px;
      color: var(--slate);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: 'Oswald', sans-serif;
      display: block;
      margin-bottom: 2px;
    }

    .vehicle-marker {
      width: 62px;
      height: 62px;
      transform-origin: 50% 50%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="status-badge">
    <svg id="wifi-bars" viewBox="0 0 26 18" width="20" height="15">
      <rect x="0" y="12" width="4" height="6" rx="1" fill="rgba(236,230,214,0.2)"/>
      <rect x="7" y="8" width="4" height="10" rx="1" fill="rgba(236,230,214,0.2)"/>
      <rect x="14" y="4" width="4" height="14" rx="1" fill="rgba(236,230,214,0.2)"/>
      <rect x="21" y="0" width="4" height="18" rx="1" fill="rgba(236,230,214,0.2)"/>
    </svg>
    <div class="coords" id="coords">Waiting for fix…</div>
  </div>

  <div id="lower-third">
    <span class="eyebrow">Anchorage &ndash; Prudhoe Bay</span>

    <div id="tally-row">
      <div class="tally-item">
        <img class="glyph" src="moose_icon.png" alt="Moose" />
        <span class="label">Moose</span>
      </div>
      <div class="tally-item">
        <img class="glyph" src="caribou_icon.png" alt="Caribou" />
        <span class="label">Caribou</span>
      </div>
      <div class="tally-item">
        <img class="glyph" src="muskox_icon.png" alt="Musk Ox" />
        <span class="label">Musk Ox</span>
      </div>
      <div class="tally-item">
        <img class="glyph" src="bear_icon.png" alt="Bear" />
        <span class="label">Bear</span>
      </div>
    </div>

    <div id="stats-row">
      <div class="stat">
        <span class="label">From Anchorage</span>
        <span class="n" id="miles-from">-- mi</span>
      </div>
      <div class="stat">
        <span class="label">To Prudhoe Bay</span>
        <span class="n" id="miles-to">-- mi</span>
      </div>
      <div class="stat">
        <span class="label">Temp</span>
        <span class="n" id="temp-readout">-- °F</span>
      </div>
      <div class="stat">
        <span class="label">Wind</span>
        <span class="n" id="wind-readout">-- mph</span>
      </div>
      <div class="stat">
        <span class="label">Speed</span>
        <span class="n" id="speed">0 mph</span>
      </div>
      <div class="stat">
        <span class="label">Heading</span>
        <span class="n" id="heading">--</span>
      </div>
      <div class="stat">
        <span class="label">Altitude</span>
        <span class="n" id="altitude">--</span>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const statusBadge = document.getElementById("status-badge");
    const coordsElement = document.getElementById("coords");
    const speedElement = document.getElementById("speed");
    const headingElement = document.getElementById("heading");
    const altitudeElement = document.getElementById("altitude");
    const milesFromElement = document.getElementById("miles-from");
    const milesToElement = document.getElementById("miles-to");
    const tempReadout = document.getElementById("temp-readout");
    const windReadout = document.getElementById("wind-readout");
    const wifiBars = document.getElementById("wifi-bars");

    // Leaflet uses [lat, lon] order (MapLibre used [lon, lat] -- flipped here)
    const initialLocation = [61.2181, -149.9003];

    const map = L.map("map", {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      tap: false
    }).setView(initialLocation, 9);

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19
    }).addTo(map);

    // Route highlight: the actual Anchorage -> Prudhoe Bay driving route,
    // fetched from the same repo (no dependency on the phone's local relay).
    fetch("route_line.json", { cache: "no-store" })
      .then((res) => res.ok ? res.json() : null)
      .then((coords) => {
        if (!coords) return;
        // Dark halo underneath so the line reads against any terrain color
        L.polyline(coords, {
          color: "#10161A",
          weight: 7,
          opacity: 0.55,
          lineCap: "round"
        }).addTo(map);
        // Brass dashed line on top
        L.polyline(coords, {
          color: "#C1913F",
          weight: 4,
          opacity: 0.95,
          dashArray: "10 8",
          lineCap: "round"
        }).addTo(map);
      })
      .catch(() => {
        // route file missing or unreachable -- map still works without it
      });

    const markerIcon = L.divIcon({
      className: "",
      html: `<div class="vehicle-marker">
        <img src="https://d8j0ntlcm91z4.cloudfront.net/user_3EbasAQZybJmYL3OgvVPTlYIoMi/hf_20260803_064522_89519cb7-681e-4da1-b2a7-861b772ff0ae.png"
             alt="" style="width: 100%; height: 100%; object-fit: contain; display: block;
             filter: drop-shadow(0 0 2px rgba(0,0,0,0.7)) drop-shadow(0 0 4px rgba(0,0,0,0.4));" />
      </div>`,
      iconSize: [62, 62],
      iconAnchor: [31, 31]
    });

    const marker = L.marker(initialLocation, {
      icon: markerIcon
    }).addTo(map);

    function setMarkerHeading(el, degrees) {
      if (degrees === null || degrees === undefined || Number.isNaN(degrees)) return;
      el.style.transform = `rotate(${degrees}deg)`;
    }

    function directionFromDegrees(degrees) {
      if (degrees === null || degrees === undefined || Number.isNaN(degrees)) {
        return "--";
      }
      const directions = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      const index = Math.round(degrees / 45) % 8;
      return directions[index];
    }

    function formatCoord(value, posLabel, negLabel) {
      if (value === null || value === undefined) return "--";
      const dir = value >= 0 ? posLabel : negLabel;
      return `${Math.abs(value).toFixed(4)}° ${dir}`;
    }

    function updateTemp(tempF) {
      tempReadout.textContent = tempF !== null && tempF !== undefined
        ? `${Math.round(tempF)} °F`
        : "-- °F";
    }

    function updateWind(mph, dirDeg) {
      if (mph === null || mph === undefined) {
        windReadout.textContent = "-- mph";
        return;
      }
      const dir = directionFromDegrees(dirDeg);
      windReadout.textContent = dir !== "--"
        ? `${Math.round(mph)} mph ${dir}`
        : `${Math.round(mph)} mph`;
    }

    function updateWifiBars(bars) {
      const rects = wifiBars.querySelectorAll("rect");
      rects.forEach((rect, i) => {
        if (bars === null || bars === undefined) {
          // Unknown -- Termux:API not installed or not reporting yet
          rect.setAttribute("fill", "rgba(236,230,214,0.2)");
        } else if (i < bars) {
          rect.setAttribute("fill", "#ECE6D6");
        } else {
          rect.setAttribute("fill", "rgba(236,230,214,0.2)");
        }
      });
    }

    // --- Telemetry relay polling ---------------------------------------
    // Streamlabs Mobile's WebView blocks navigator.geolocation, so instead
    // this polls a local HTTP relay (Termux, same phone) that GPSLogger
    // and a background weather check keep updated. Runs entirely
    // over 127.0.0.1 -- no internet dependency for the GPS hop itself.

    const RELAY = "http://127.0.0.1:8080";
    const POLL_INTERVAL_MS = 1000;
    const STALE_AFTER_MS = 8000;

    let lastGoodFix = null;
    let firstFixReceived = false;

    function handleFix(fix) {
      if (fix.lat !== null && fix.lon !== null) {
        const latLng = [fix.lat, fix.lon];
        marker.setLatLng(latLng);

        const markerEl = marker.getElement();
        if (markerEl) {
          const inner = markerEl.querySelector(".vehicle-marker");
          if (inner) setMarkerHeading(inner, fix.headingDeg);
        }

        map.panTo(latLng, { animate: true, duration: 1 });
        if (!firstFixReceived) {
          map.setView(latLng, 12);
        }

        firstFixReceived = true;
        coordsElement.textContent =
          `${formatCoord(fix.lat, "N", "S")}  ${formatCoord(fix.lon, "E", "W")}`;
      }

      const mph = fix.speedMph !== null ? Math.round(fix.speedMph) : 0;
      speedElement.textContent = `${mph} mph`;
      headingElement.textContent = directionFromDegrees(fix.headingDeg);
      altitudeElement.textContent =
        fix.altitudeFt !== null ? `${Math.round(fix.altitudeFt)} ft` : "--";

      if (fix.routeMilesFrom !== null && fix.routeMilesFrom !== undefined) {
        milesFromElement.textContent = `${fix.routeMilesFrom.toFixed(1)} mi`;
        milesToElement.textContent = `${fix.routeMilesRemaining.toFixed(1)} mi`;
      } else {
        milesFromElement.textContent = "--";
        milesToElement.textContent = "--";
      }

      updateTemp(fix.tempF);
      updateWind(fix.windMph, fix.windDirDeg);
      updateWifiBars(fix.wifiBars);

      if (!fix.relayReachable) {
        coordsElement.textContent = "Relay unreachable";
        statusBadge.classList.add("stale");
      } else if (fix.stale) {
        coordsElement.textContent = firstFixReceived
          ? "Signal lost — last known position"
          : "Waiting for first fix…";
        statusBadge.classList.add("stale");
      } else {
        statusBadge.classList.remove("stale");
      }
    }

    async function pollTelemetry() {
      try {
        const res = await fetch(`${RELAY}/telemetry`, { cache: "no-store" });
        if (!res.ok) throw new Error(`Relay returned ${res.status}`);
        const data = await res.json();

        const hasFix = data.lat !== null && data.lon !== null;
        const ageMs = data.updated_at
          ? (Date.now() / 1000 - data.updated_at) * 1000
          : Infinity;

        const fix = {
          lat: hasFix ? data.lat : lastGoodFix?.lat ?? null,
          lon: hasFix ? data.lon : lastGoodFix?.lon ?? null,
          speedMph: data.speed_mph,
          headingDeg: data.heading_deg,
          altitudeFt: data.altitude_ft,
          tempF: data.temp_f,
          windMph: data.wind_mph,
          windDirDeg: data.wind_dir_deg,
          wifiBars: data.wifi_bars,
          milesDriven: data.miles_driven,
          tripActive: data.trip_active,
          routeMilesFrom: data.route_miles_from_anchorage,
          routeMilesRemaining: data.route_miles_remaining,
          stale: !hasFix || ageMs > STALE_AFTER_MS,
          relayReachable: true
        };

        if (hasFix) lastGoodFix = fix;
        handleFix(fix);
      } catch (err) {
        handleFix({
          lat: lastGoodFix?.lat ?? null,
          lon: lastGoodFix?.lon ?? null,
          speedMph: null,
          headingDeg: null,
          altitudeFt: null,
          tempF: null,
          stale: true,
          relayReachable: false
        });
      }
    }

    pollTelemetry();
    setInterval(pollTelemetry, POLL_INTERVAL_MS);
  </script>
</body>
</html>
