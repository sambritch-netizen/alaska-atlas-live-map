<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  />

  <title>Alaska Atlas Live Map</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    #status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 16px;
    }

    #status.stale {
      background: rgba(150, 30, 30, 0.85);
    }

    #telemetry {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;

      display: flex;
      justify-content: space-between;
      gap: 8px;

      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 16px;
    }

    .vehicle-marker {
      width: 26px;
      height: 26px;
      border: 4px solid white;
      border-radius: 50%;
      background: #1976d2;
      box-shadow: 0 0 0 4px rgba(25, 118, 210, 0.3);
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="status">Waiting for GPS relay…</div>

  <div id="telemetry">
    <span id="speed">0 mph</span>
    <span id="heading">Heading: --</span>
    <span id="altitude">Altitude: --</span>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>

  <script>
    const statusElement = document.getElementById("status");
    const speedElement = document.getElementById("speed");
    const headingElement = document.getElementById("heading");
    const altitudeElement = document.getElementById("altitude");

    const initialLocation = [-149.9003, 61.2181];

    const map = new maplibregl.Map({
      container: "map",

      style: {
        version: 8,
        sources: {
          openStreetMap: {
            type: "raster",
            tiles: [
              "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
            ],
            tileSize: 256,
            attribution: "© OpenStreetMap contributors"
          }
        },

        layers: [
          {
            id: "openStreetMap",
            type: "raster",
            source: "openStreetMap"
          }
        ]
      },

      center: initialLocation,
      zoom: 9,
      attributionControl: false
    });

    const markerElement = document.createElement("div");
    markerElement.className = "vehicle-marker";

    const marker = new maplibregl.Marker({
      element: markerElement
    })
      .setLngLat(initialLocation)
      .addTo(map);

    function directionFromDegrees(degrees) {
      if (
        degrees === null ||
        degrees === undefined ||
        Number.isNaN(degrees)
      ) {
        return "--";
      }

      const directions = [
        "N",
        "NE",
        "E",
        "SE",
        "S",
        "SW",
        "W",
        "NW"
      ];

      const index = Math.round(degrees / 45) % 8;
      return directions[index];
    }

    // --- Telemetry relay polling ---------------------------------------
    // Replaces navigator.geolocation.watchPosition(), which Streamlabs
    // Mobile's WebView blocks. Instead this polls a tiny local HTTP server
    // (running in Termux on the same phone) that GPSLogger feeds every few
    // seconds. Everything stays on-device — no internet round trip needed
    // for GPS itself.

    const TELEMETRY_URL = "http://127.0.0.1:8080/telemetry";
    const POLL_INTERVAL_MS = 1000;
    const STALE_AFTER_MS = 8000; // show "signal lost" if no fresh fix in 8s

    let lastGoodFix = null;
    let firstFixReceived = false;

    function handleFix(fix) {
      if (fix.lat !== null && fix.lon !== null) {
        marker.setLngLat([fix.lon, fix.lat]);

        map.easeTo({
          center: [fix.lon, fix.lat],
          zoom: firstFixReceived ? map.getZoom() : 12,
          bearing:
            fix.headingDeg !== null && !Number.isNaN(fix.headingDeg)
              ? fix.headingDeg
              : map.getBearing(),
          duration: 1000,
          essential: true
        });

        firstFixReceived = true;
      }

      const mph = fix.speedMph !== null ? Math.round(fix.speedMph) : 0;
      speedElement.textContent = `${mph} mph`;
      headingElement.textContent =
        `Heading: ${directionFromDegrees(fix.headingDeg)}`;
      altitudeElement.textContent =
        fix.altitudeFt !== null
          ? `Altitude: ${Math.round(fix.altitudeFt)} ft`
          : "Altitude: --";

      if (!fix.relayReachable) {
        statusElement.textContent = "Relay unreachable — check Termux";
        statusElement.classList.add("stale");
      } else if (fix.stale) {
        statusElement.textContent = firstFixReceived
          ? "GPS signal lost — holding last position"
          : "Waiting for first GPS fix…";
        statusElement.classList.add("stale");
      } else {
        statusElement.textContent = "GPS connected (relay)";
        statusElement.classList.remove("stale");
      }
    }

    async function pollTelemetry() {
      try {
        const res = await fetch(TELEMETRY_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`Relay returned ${res.status}`);
        const data = await res.json();

        const hasFix = data.lat !== null && data.lon !== null;
        const ageMs = data.updated_at
          ? (Date.now() / 1000 - data.updated_at) * 1000
          : Infinity;

        const fix = {
          lat: hasFix ? data.lat : lastGoodFix?.lat ?? null,
          lon: hasFix ? data.lon : lastGoodFix?.lon ?? null,
          speedMph: data.speed_mph,
          headingDeg: data.heading_deg,
          altitudeFt: data.altitude_ft,
          stale: !hasFix || ageMs > STALE_AFTER_MS,
          relayReachable: true
        };

        if (hasFix) lastGoodFix = fix;
        handleFix(fix);
      } catch (err) {
        handleFix({
          lat: lastGoodFix?.lat ?? null,
          lon: lastGoodFix?.lon ?? null,
          speedMph: null,
          headingDeg: null,
          altitudeFt: null,
          stale: true,
          relayReachable: false
        });
      }
    }

    pollTelemetry();
    setInterval(pollTelemetry, POLL_INTERVAL_MS);
  </script>
</body>
</html>
